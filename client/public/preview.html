<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>Vorschau</title></head>
<body>
<script>
  /*
   * Codefunke-Vorschau für HTML/CSS/JavaScript.
   * Diese Seite läuft in einem abgeschotteten iframe (sandbox ohne allow-same-origin):
   * Sie hat keinen Zugriff auf Cookies, Konto oder die Codefunke-Seite.
   * Die Webseite schickt den HTML-Code per postMessage, wir schreiben ihn in dieses Dokument.
   */
  (function () {
    function consoleHook() {
      function fmt(v) {
        if (typeof v === "string") return v;
        try { return JSON.stringify(v); } catch (e) { return String(v); }
      }
      ["log", "info", "warn", "error"].forEach(function (level) {
        var orig = console[level];
        console[level] = function () {
          var text = Array.prototype.map.call(arguments, fmt).join(" ");
          parent.postMessage({ type: "console", level: level, text: text }, "*");
          orig.apply(console, arguments);
        };
      });
      window.addEventListener("error", function (e) {
        parent.postMessage({ type: "console", level: "error", text: e.message + (e.lineno ? " (Zeile " + e.lineno + ")" : "") }, "*");
      });
    }
    window.addEventListener("message", function (e) {
      if (e.source !== window.parent || !e.data || e.data.type !== "render") return;
      var hook = "<script>(" + consoleHook.toString() + ")();<\/script>";
      document.open();
      document.write(hook + String(e.data.html));
      document.close();
    });
    parent.postMessage({ type: "preview-ready" }, "*");
  })();
</script>
</body>
</html>
