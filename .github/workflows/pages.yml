# Veröffentlicht Codefunke automatisch auf GitHub Pages – bei jedem Push auf "main".
# Einmalig nötig: Repository → Settings → Pages → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pages konfigurieren
        id: pages
        uses: actions/configure-pages@v6

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests (Inhalte, Logik, API)
        run: npm test

      - name: Statische Seite bauen
        run: npm run build:pages
        env:
          # z. B. "/codefunke/" – oder "/" für <name>.github.io
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Seite hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: client/dist-pages
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
